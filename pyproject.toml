[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airframe-agents"
version = "0.9.0rc6"
description = "Vendor-neutral agent runtime: one protocol, pluggable adapters for Claude Code, GitHub Copilot, AWS Bedrock, the OpenCode HTTP agent server, and OpenAI-compatible gateways."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Airframe Contributors" },
]
keywords = ["ai", "agents", "claude", "copilot", "bedrock", "opencode", "llm", "runtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core deps. Vendor SDKs are optional extras — see below.
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
# Each adapter family pulls only the SDK it needs.
# `claude` pulls both the Agent SDK (subprocess + JSON-RPC) and the
# Anthropic Python client. The latter is used by `list_models()` so
# OAuth subscription auth (Bearer token + `oauth-2025-04-20` beta
# header) works — `/v1/models` doesn't accept the OAuth bearer
# without that header, and the Anthropic SDK manages the dance.
claude = ["claude-agent-sdk>=0.2.106,<1", "anthropic>=0.111.0,<1"]
copilot = ["github-copilot-sdk>=1.0.2,<2"]
# `openai-compat` covers every OpenAI-compatible HTTP adapter:
# OpenCodeZenRuntime (per-token), OpenCodeGoRuntime (subscription),
# and future siblings (Together, Groq, Fireworks, OpenRouter, ...).
# All share the same `openai` SDK underneath. ``tiktoken`` powers
# pre-flight ``count_tokens()`` for OpenAI's GPT-* family; compat
# vendors using non-OpenAI tokenisers (DeepSeek, Llama, etc.) get
# an approximate count or a clean UnsupportedFeatureError per model.
openai-compat = [
    "openai>=2.43.0,<3",
    "tiktoken>=0.7,<1",
]
# `bedrock` covers AWS Bedrock's Converse API via aioboto3 — the
# async wrapper around botocore. Fronts Anthropic / Meta / Mistral /
# Cohere / Amazon Nova / AI21 behind one AWS-billed endpoint.
bedrock = ["aioboto3>=13"]
# kimi adapter removed (security: drops vulnerable transitive mcp<1.17).
# Commented out for restorability:
# # `kimi` covers Moonshot AI's Kimi Agent SDK — a subprocess-class
# # agent SDK over the open-weight Kimi K2 line. Two upstream
# # constraints worth knowing:
# #
# # 1. ``kimi-agent-sdk`` requires Python >=3.12. As of the 3.12 floor
# #    bump this matches airframe's own ``requires-python``, so no env
# #    marker is needed — every supported interpreter can install it.
# # 2. ``kimi-cli`` 1.12.0 → ``fastmcp`` 2.12.5 → ``mcp<1.17`` conflicts
# #    with ``claude-agent-sdk``'s ``mcp>=1.23``. See [tool.uv]
# #    conflicts below — the two SDKs can't be co-installed in one
# #    environment. Users wanting both must split into separate venvs
# #    until upstream resolves.
# kimi = ["kimi-agent-sdk>=0.0.5,<0.1"]
# `opencode` covers the OpenCode HTTP agent server adapter — distinct
# from `[openai-compat]` (which serves OpenCodeZen / OpenCodeGo over
# `https://opencode.ai/zen/*`). The Stainless-generated client is
# pre-1.0; pin tightly so a regenerated breaking change doesn't ship
# through us silently.
opencode = ["opencode-ai>=0.1.0a36,<0.2"]
# Brings in pytest for adapter authors that want to run the shared
# `airframe.testing.contracts` conformance suite against their own
# adapter. The main package does not depend on pytest.
testing = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=0.24.0,<2",
]
# "Batteries included" — installs every co-installable adapter SDK.
all = [
    "claude-agent-sdk>=0.2.106,<1",
    "anthropic>=0.111.0,<1",
    "github-copilot-sdk>=1.0.2,<2",
    "openai>=2.43.0,<3",
    "tiktoken>=0.7,<1",
    "aioboto3>=13",
    "opencode-ai>=0.1.0a36,<0.2",
]

[project.scripts]
# Thin shell over discovery + the AgentRuntime protocol. Lets one
# prompt run against any installed adapter from a shell / CI step —
# the foundation the GitHub Action wraps. See `airframe.cli`.
airframe = "airframe.cli:main"

[project.urls]
Homepage = "https://github.com/get2knowio/airframe"
Documentation = "https://github.com/get2knowio/airframe/tree/main/docs"
Repository = "https://github.com/get2knowio/airframe"
Issues = "https://github.com/get2knowio/airframe/issues"
Changelog = "https://github.com/get2knowio/airframe/blob/main/CHANGELOG.md"
"Architecture" = "https://github.com/get2knowio/airframe/blob/main/docs/architecture.md"
"Security" = "https://github.com/get2knowio/airframe/blob/main/SECURITY.md"

[dependency-groups]
test = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=0.24.0,<2",
    "pytest-cov>=4.0.0,<8",
    "pytest-timeout>=2.0.0,<3",
    # SDKs needed for the test suite (mocked at the boundary, but
    # tests import names like `claude_agent_sdk.ResultMessage`).
    "claude-agent-sdk>=0.2.106,<1",
    "anthropic>=0.111.0,<1",
    "github-copilot-sdk>=1.0.2,<2",
    "openai>=2.43.0,<3",
    "tiktoken>=0.7,<1",
    "aioboto3>=13",
    "opencode-ai>=0.1.0a36,<0.2",
]
lint = [
    "ruff>=0.15.18,<1",
    "mypy>=1.0.0,<3",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

# kimi adapter removed (security: drops vulnerable transitive mcp<1.17).
# The [tool.uv] conflicts table existed ONLY because of kimi; commented
# out for restorability.
# [tool.uv]
# # Upstream conflict: kimi-agent-sdk 0.0.5 → kimi-cli 1.12.0 → fastmcp
# # 2.12.5 → mcp<1.17, but claude-agent-sdk 0.2.82 → mcp>=1.23. Until
# # Moonshot publishes a newer kimi-agent-sdk that widens the kimi-cli
# # range, the two SDKs cannot be co-installed. Declaring the conflicts
# # here lets `uv sync --all-extras` succeed by picking one side at
# # resolution time; the lockfile splits the environments. The dev /
# # test groups also pull claude-agent-sdk for the mocked unit suite,
# # so `[kimi]` is mutually exclusive with the dev / test groups too —
# # CI runs the kimi unit tests against a mocked surface, so this
# # doesn't block coverage.
# conflicts = [
#     [
#         { extra = "kimi" },
#         { extra = "claude" },
#     ],
#     [
#         { extra = "kimi" },
#         { extra = "all" },
#     ],
#     [
#         { extra = "kimi" },
#         { group = "test" },
#     ],
#     [
#         { extra = "kimi" },
#         { group = "dev" },
#     ],
# ]

[tool.hatch.build.targets.wheel]
packages = ["src/airframe"]

[tool.hatch.build.targets.sdist]
# Dev-internal docs (implementation-plan / feature-roadmap) and the
# devcontainer config don't belong in the published sdist. Examples
# stay in because they're useful as live probes for end users.
exclude = [
    "dev-docs/",
    ".devcontainer/",
    ".github/",
    "CLAUDE.md",
    "memory/",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "SIM102", # Nested if statements
    "SIM105", # contextlib.suppress — try/except/pass is more explicit in teardown
    "SIM108", # Ternary operator
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = [
    "B017",
    "N806",
    "SIM117",
    "B023",
]

[tool.mypy]
strict = false
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
ignore_missing_imports = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--timeout=30",
]
markers = [
    "integration: marks tests requiring external services",
]
timeout = 30

[tool.coverage.run]
source = ["src/airframe"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
