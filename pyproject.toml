[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airframe-agents"
version = "0.6.0"
description = "Vendor-neutral agent runtime: one protocol, pluggable adapters for Claude Code, GitHub Copilot, OpenAI Codex, and OpenCode Zen."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Airframe Contributors" },
]
keywords = ["ai", "agents", "claude", "copilot", "codex", "opencode", "llm", "runtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core deps. Vendor SDKs are optional extras — see below.
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
# Each adapter family pulls only the SDK it needs.
# httpx is in the core deps (needed by ClaudeCodeRuntime.list_models()).
claude = ["claude-agent-sdk>=0.2.0,<1"]
copilot = ["github-copilot-sdk>=0.3.0"]
codex = ["openai-codex-sdk>=0.1.11"]
# `openai-compat` covers every OpenAI-compatible HTTP adapter:
# OpenCodeZenRuntime (per-token), OpenCodeGoRuntime (subscription),
# and future siblings (Together, Groq, Fireworks, OpenRouter, ...).
# All share the same `openai` SDK underneath.
openai-compat = ["openai>=1.50,<3"]
# `bedrock` covers AWS Bedrock's Converse API via aioboto3 — the
# async wrapper around botocore. Fronts Anthropic / Meta / Mistral /
# Cohere / Amazon Nova / AI21 behind one AWS-billed endpoint.
bedrock = ["aioboto3>=13"]
# Brings in pytest for adapter authors that want to run the shared
# `airframe.testing.contracts` conformance suite against their own
# adapter. The main package does not depend on pytest.
testing = [
    "pytest>=8.2.0,<9",
    "pytest-asyncio>=0.24.0,<1",
]
# "Batteries included" — installs every adapter family's SDK.
all = [
    "claude-agent-sdk>=0.2.0,<1",
    "github-copilot-sdk>=0.3.0",
    "openai-codex-sdk>=0.1.11",
    "openai>=1.50,<3",
    "aioboto3>=13",
]

[project.urls]
Homepage = "https://github.com/get2knowio/airframe"
Documentation = "https://github.com/get2knowio/airframe/tree/main/docs"
Repository = "https://github.com/get2knowio/airframe"
Issues = "https://github.com/get2knowio/airframe/issues"
Changelog = "https://github.com/get2knowio/airframe/blob/main/CHANGELOG.md"
"Architecture" = "https://github.com/get2knowio/airframe/blob/main/docs/architecture.md"
"Security" = "https://github.com/get2knowio/airframe/blob/main/SECURITY.md"

[dependency-groups]
test = [
    "pytest>=8.2.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "pytest-cov>=4.0.0,<6",
    "pytest-timeout>=2.0.0,<3",
    # SDKs needed for the test suite (mocked at the boundary, but
    # tests import names like `claude_agent_sdk.ResultMessage`).
    "claude-agent-sdk>=0.2.0,<1",
    "github-copilot-sdk>=0.3.0",
    "openai-codex-sdk>=0.1.11",
    "openai>=1.50,<3",
    "aioboto3>=13",
]
lint = [
    "ruff>=0.1.0,<1",
    "mypy>=1.0.0,<2",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/airframe"]

[tool.hatch.build.targets.sdist]
# Dev-internal docs (implementation-plan / feature-roadmap) and the
# devcontainer config don't belong in the published sdist. Examples
# stay in because they're useful as live probes for end users.
exclude = [
    "dev-docs/",
    ".devcontainer/",
    ".github/",
    "CLAUDE.md",
    "memory/",
]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "SIM102", # Nested if statements
    "SIM105", # contextlib.suppress — try/except/pass is more explicit in teardown
    "SIM108", # Ternary operator
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = [
    "B017",
    "N806",
    "SIM117",
    "B023",
]

[tool.mypy]
strict = false
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
ignore_missing_imports = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--timeout=30",
]
markers = [
    "integration: marks tests requiring external services",
]
timeout = 30

[tool.coverage.run]
source = ["src/airframe"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
