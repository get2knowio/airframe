name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege at the top; the two jobs that need more escalate
# locally.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Setup
        run: mise run setup
      - name: Check
        run: mise run check

  release:
    name: Create GitHub Release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Check if pre-release
        id: prerelease
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # PEP 440 pre-release segments come in two written forms:
          # canonical (no dash, e.g. v0.9.0rc1 / v1.0.0a2 / v1.0.0b3 /
          # v1.0.0.dev1) and the dashed convenience form many projects
          # use on git tags (v0.9.0-rc1). Match both. The trailing
          # digit + word boundary keeps us from misclassifying random
          # substrings (`vbeta-monitor` ≠ pre-release).
          if [[ "$TAG" =~ -(rc|beta|alpha|dev)[0-9]+$ ]] \
             || [[ "$TAG" =~ [0-9](rc|a|b|c)[0-9]+$ ]] \
             || [[ "$TAG" =~ \.dev[0-9]+$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get previous tag
        id: prev_tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          IS_PRE="${{ steps.prerelease.outputs.is_prerelease }}"
          if [ "$IS_PRE" == "true" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          else
            PREV_TAG=$(git tag -l | grep -v -E '(-rc|-beta|-alpha|-dev)' | grep -v "^${TAG}$" | sort -V | tail -1)
            PREV_TAG="${PREV_TAG:-}"
          fi
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          VERSION="${TAG#v}"

          cat > release_notes.md << 'HEADER'
          ## Installation

          ```bash
          # Install via pip
          pip install airframe-agents

          # Or with uv
          uv add airframe-agents
          ```

          Each adapter ships behind an optional extra — see the README's
          install matrix.
          HEADER

          if [ "${{ steps.prerelease.outputs.is_prerelease }}" == "true" ]; then
            cat >> release_notes.md << PRERELEASE

          > **Note:** This is a pre-release version. Pin to it explicitly:
          > \`\`\`bash
          > pip install airframe-agents==${VERSION}
          > uv add airframe-agents==${VERSION}
          > \`\`\`
          PRERELEASE
          fi

          echo "" >> release_notes.md

          if [ "${{ steps.prerelease.outputs.is_prerelease }}" == "true" ] && [ -n "$PREV_TAG" ]; then
            echo "## Changes" >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" >> release_notes.md
            echo "" >> release_notes.md
            echo "" >> release_notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> release_notes.md
          elif [ "${{ steps.prerelease.outputs.is_prerelease }}" == "false" ]; then
            TAG_MSG=$(git tag -l --format='%(contents)' "$TAG" | tail -n +2)
            if [ -n "$TAG_MSG" ]; then
              echo "$TAG_MSG" >> release_notes.md
            elif [ -n "$PREV_TAG" ]; then
              echo "## Changes" >> release_notes.md
              echo "" >> release_notes.md
              git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" >> release_notes.md
            fi
            echo "" >> release_notes.md
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> release_notes.md
            fi
          else
            echo "Initial release" >> release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          draft: false

  publish:
    name: Publish to PyPI
    needs: [check, release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # Trusted Publishing — no long-lived PyPI token anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs reads the tag from git to stamp the version. A
          # shallow clone at a tag happens to work; setting this anyway
          # so whoever adds a branch build later does not get a
          # silently wrong version.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build package
        run: uv build
      - name: Verify the built version matches the tag
        # Tautological now that the version is derived from the tag
        # rather than hand-set — kept as a backstop, not as the
        # mechanism. Compared as PEP 440 versions so the dashed tag
        # form (v0.9.0-rc1) and the canonical one (v0.9.0rc1) agree.
        run: |
          uv run --with packaging --no-project python - <<'PY'
          import glob, os, re, sys
          from packaging.version import Version

          tag = os.environ["GITHUB_REF"].removeprefix("refs/tags/")
          expected = Version(tag.removeprefix("v"))
          wheel = os.path.basename(glob.glob("dist/*.whl")[0])
          built = Version(re.match(r"airframe_agents-(.+?)-py3", wheel).group(1))
          if built != expected:
              sys.exit(f"::error::tag {tag} expects {expected} but the wheel is {built}")
          print(f"ok: {tag} -> {built}")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
