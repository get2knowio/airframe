name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: uv sync --all-extras --group dev --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest --tb=short -q

  build:
    name: Build and verify artifacts
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      # --no-sources proves the build works with `tool.uv.sources`
      # disabled, which is how every other build tool — and therefore
      # PyPI — sees this project. Cheap insurance today (we declare no
      # sources), load-bearing the moment a path or git source is added.
      - name: Build sdist and wheel
        run: uv build --no-sources
      - name: Verify artifact metadata and contents
        run: |
          uvx twine check dist/*
          uvx check-wheel-contents dist/*.whl
      # Everything downstream consumes THIS artifact. Rebuilding in the
      # publish job would mean shipping bytes nothing ever installed.
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  install-matrix:
    name: Install ${{ matrix.label }} (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        include:
          # The bare install is the important row: it is the only
          # configuration where the vendor SDKs are genuinely absent, so
          # it is the only place the lazy-import invariant can actually
          # fail. `uv sync --all-extras` in the test job can never catch it.
          - { extra: "", label: "no extras" }
          - { extra: "[claude]", label: "claude" }
          - { extra: "[copilot]", label: "copilot" }
          - { extra: "[openai-compat]", label: "openai-compat" }
          - { extra: "[bedrock]", label: "bedrock" }
          - { extra: "[opencode]", label: "opencode" }
          - { extra: "[all]", label: "all" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Install the wheel by explicit PATH, not by name. `--find-links`
      # only *adds* to the index, so if PyPI already carries a version
      # newer than the one being released, the resolver picks that one and
      # the whole matrix silently verifies the previously-published
      # package instead of the artifact about to ship. Appending the extra
      # to the path still resolves that extra's dependencies from PyPI,
      # which is the behaviour we want.
      - name: Install the built wheel into a clean environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          WHEEL=$(ls dist/*.whl)
          echo "Installing ${WHEEL}${{ matrix.extra }}"
          uv pip install "${WHEEL}${{ matrix.extra }}"
      # Invoke the venv interpreter directly rather than through `uv run`,
      # so there is no chance of the repo checkout's own project env being
      # picked up instead of the environment the wheel was installed into.
      - name: Smoke the installed distribution
        run: .venv/bin/python scripts/smoke_install.py

  release:
    name: Create GitHub Release
    needs: install-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Check if pre-release
        id: prerelease
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # PEP 440 pre-release segments come in two written forms:
          # canonical (no dash, e.g. v0.9.0rc1 / v1.0.0a2 / v1.0.0b3 /
          # v1.0.0.dev1) and the dashed convenience form many projects
          # use on git tags (v0.9.0-rc1). Match both. The trailing
          # digit + word boundary keeps us from misclassifying random
          # substrings (`vbeta-monitor` ≠ pre-release).
          if [[ "$TAG" =~ -(rc|beta|alpha|dev)[0-9]+$ ]] \
             || [[ "$TAG" =~ [0-9](rc|a|b|c)[0-9]+$ ]] \
             || [[ "$TAG" =~ \.dev[0-9]+$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get previous tag
        id: prev_tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          IS_PRE="${{ steps.prerelease.outputs.is_prerelease }}"
          if [ "$IS_PRE" == "true" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          else
            PREV_TAG=$(git tag -l | grep -v -E '(-rc|-beta|-alpha|-dev)' | grep -v "^${TAG}$" | sort -V | tail -1)
            PREV_TAG="${PREV_TAG:-}"
          fi
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          VERSION="${TAG#v}"

          cat > release_notes.md << 'HEADER'
          ## Installation

          ```bash
          # Install via pip
          pip install airframe-agents

          # Or with uv
          uv add airframe-agents
          ```

          Each adapter ships behind an optional extra — see the README's
          install matrix.
          HEADER

          if [ "${{ steps.prerelease.outputs.is_prerelease }}" == "true" ]; then
            cat >> release_notes.md << PRERELEASE

          > **Note:** This is a pre-release version. Pin to it explicitly:
          > \`\`\`bash
          > pip install airframe-agents==${VERSION}
          > uv add airframe-agents==${VERSION}
          > \`\`\`
          PRERELEASE
          fi

          echo "" >> release_notes.md

          if [ "${{ steps.prerelease.outputs.is_prerelease }}" == "true" ] && [ -n "$PREV_TAG" ]; then
            echo "## Changes" >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" >> release_notes.md
            echo "" >> release_notes.md
            echo "" >> release_notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> release_notes.md
          elif [ "${{ steps.prerelease.outputs.is_prerelease }}" == "false" ]; then
            TAG_MSG=$(git tag -l --format='%(contents)' "$TAG" | tail -n +2)
            if [ -n "$TAG_MSG" ]; then
              echo "$TAG_MSG" >> release_notes.md
            elif [ -n "$PREV_TAG" ]; then
              echo "## Changes" >> release_notes.md
              echo "" >> release_notes.md
              git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" >> release_notes.md
            fi
            echo "" >> release_notes.md
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> release_notes.md
            fi
          else
            echo "Initial release" >> release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          draft: false

  publish:
    name: Publish to PyPI
    needs: [install-matrix, release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # No checkout, no rebuild. Publishing the exact artifact the
      # install matrix exercised is the whole point of this restructure:
      # a rebuild here could differ from what was verified.
      - name: Download the verified dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
