name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install
        # --no-extra kimi: kimi-agent-sdk's mcp pin conflicts with
        # claude-agent-sdk's. Kimi unit tests use mocks; CI doesn't
        # need the real SDK installed.
        run: uv sync --all-extras --no-extra kimi --group dev
      - name: Ruff check
        run: uv run ruff check src tests examples
      - name: Ruff format check
        run: uv run ruff format --check src tests examples
      - name: Mypy
        run: uv run mypy src/airframe

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        # --no-extra kimi: kimi-agent-sdk's mcp pin conflicts with
        # claude-agent-sdk's. Kimi unit tests use mocks; CI doesn't
        # need the real SDK installed.
        run: uv sync --all-extras --no-extra kimi --group dev
      - name: Run tests
        run: uv run pytest
