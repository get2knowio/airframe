name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI reads the tree and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The gate is `mise run check` — the same verb a contributor runs
    # locally. CI must never spell the steps out inline; two lists that
    # agree today are two lists that drift tomorrow.
    name: Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of `requires-python`. Both are
        # tested; neither is claimed without being exercised.
        python-version: ["3.12", "3.13", "3.14"]
    env:
      # Overrides `[tools] python` in mise.toml for this job only.
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs resolves the version from tag history; a shallow
          # branch clone silently produces a plausible but wrong base
          # version instead of failing.
          fetch-depth: 0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Setup
        # `--all-extras`: with `ignore_missing_imports`, an uninstalled
        # extra degrades those modules to `Any` and mypy passes while
        # checking nothing.
        run: mise run setup

      - name: Check
        run: mise run check
